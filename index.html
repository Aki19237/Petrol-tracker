<!DOCTYPE html>
<html lang="en">
<head>
    html
<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Petrol Expenditure Tracker</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background:#f0f2f5; color:#333; padding:16px;
        }
        .container { max-width:960px; margin:0 auto; }
        h1 { text-align:center; margin-bottom:6px; color:#1a1a2e; font-size:1.5rem; }
        .subtitle { text-align:center; color:#666; margin-bottom:24px; font-size:.9rem; }

        /* Summary */
        .summary { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:24px; }
        .card { background:#fff; border-radius:10px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.07); text-align:center; }
        .card .label { font-size:.75rem; text-transform:uppercase; letter-spacing:.4px; color:#888; margin-bottom:4px; }
        .card .value { font-size:1.3rem; font-weight:700; color:#1a1a2e; }

        /* Form */
        .form-section { background:#fff; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:24px; }
        .form-section h2 { font-size:1rem; margin-bottom:16px; color:#1a1a2e; border-bottom:1px solid #eee; padding-bottom:8px; }
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .form-group { display:flex; flex-direction:column; }
        .form-group label { font-size:.8rem; font-weight:600; color:#555; margin-bottom:5px; }
        .form-group input, .form-group select {
            padding:10px 12px; border:1.5px solid #ddd; border-radius:6px; font-size:.95rem;
        }
        .form-group input:focus, .form-group select:focus { outline:none; border-color:#4a6cf7; }
        .btn-row { margin-top:16px; display:flex; gap:10px; }
        .btn { padding:10px 20px; border:none; border-radius:6px; font-size:.9rem; font-weight:600; cursor:pointer; }
        .btn-primary { background:#4a6cf7; color:#fff; }
        .btn-secondary { background:#eee; color:#555; }

        /* Table */
        .table-section { background:#fff; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.07); overflow-x:auto; }
        .table-section h2 { font-size:1rem; margin-bottom:14px; color:#1a1a2e; border-bottom:1px solid #eee; padding-bottom:8px; }
        table { width:100%; border-collapse:collapse; font-size:.85rem; }
        thead th { background:#f7f8fa; text-align:left; padding:10px 12px; font-weight:700; color:#444; border-bottom:2px solid #e0e0e0; white-space:nowrap; }
        tbody td { padding:10px 12px; border-bottom:1px solid #f0f0f0; }
        tbody tr:hover { background:#f9fafb; }

        .badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:.72rem; font-weight:600; }
        .badge-95 { background:#e8f5e9; color:#2e7d32; }
        .badge-97 { background:#fff3e0; color:#e65100; }
        .badge-half { background:#e3f2fd; color:#1565c0; }

        .btn-delete { background:none; border:none; color:#e74c3c; cursor:pointer; font-size:.8rem; font-weight:600; }

        .footer { text-align:center; margin-top:24px; color:#999; font-size:.75rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>⛽ Petrol Expenditure Tracker</h1>
    <p class="subtitle">Log your fuel purchases &amp; track spending (RM)</p>

    <div class="summary" id="summaryCards"></div>

    <div class="form-section">
        <h2>Add New Entry</h2>
        <form id="petrolForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="distance">Distance (km)</label>
                    <input type="number" id="distance" placeholder="e.g. 300" min="1" required>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="cost">Cost (RM)</label>
                    <input type="number" id="cost" placeholder="e.g. 65.00" min="1" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="fuelType">Fuel Type</label>
                    <select id="fuelType">
                        <option value="">— Select —</option>
                        <option value="95">95 Petrol</option>
                        <option value="97">97 Petrol</option>
                        <option value="half">Half Tank</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top:12px;">
                <label for="notes">Notes (optional)</label>
                <input type="text" id="notes" placeholder="e.g. Full tank, highway trip">
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary">＋ Add Entry</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
            </div>
        </form>
    </div>

    <div class="table-section">
        <h2>Entries (<span id="entryCount">0</span>)</h2>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>km</th>
                    <th>Cost (RM)</th>
                    <th>Fuel</th>
                    <th>Notes</th>
                    <th>RM/km</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <p class="footer">Data stored locally on this device.</p>
</div>

<script>
const defaultEntries = [
    {distance:232,date:"2025-07-04",cost:65,fuelType:"",notes:""},
    {distance:292,date:"2025-04-17",cost:65,fuelType:"",notes:""},
    {distance:330,date:"2025-05-02",cost:65,fuelType:"",notes:""},
    {distance:306,date:"2025-05-13",cost:65,fuelType:"",notes:""},
    {distance:331,date:"2025-05-22",cost:97,fuelType:"97",notes:""},
    {distance:211,date:"2025-06-05",cost:69,fuelType:"",notes:""},
    {distance:424,date:"2025-06-12",cost:42,fuelType:"half",notes:"Half tank"},
    {distance:400,date:"2025-06-29",cost:65,fuelType:"",notes:""},
    {distance:295,date:"2025-07-05",cost:63,fuelType:"",notes:""},
    {distance:285,date:"2025-07-26",cost:57,fuelType:"",notes:""},
    {distance:280,date:"2025-08-09",cost:55,fuelType:"",notes:""},
    {distance:246,date:"2025-08-23",cost:47,fuelType:"",notes:""},
    {distance:287,date:"2025-09-08",cost:47,fuelType:"",notes:""},
    {distance:280,date:"2025-10-01",cost:54,fuelType:"",notes:""},
    {distance:305,date:"2025-10-22",cost:40,fuelType:"",notes:""},
    {distance:266,date:"2025-11-16",cost:57,fuelType:"",notes:""},
    {distance:329,date:"2025-11-30",cost:49,fuelType:"",notes:""},
    {distance:349,date:"2025-12-21",cost:56,fuelType:"",notes:""},
    {distance:397,date:"2025-12-25",cost:58,fuelType:"",notes:""},
    {distance:327,date:"2026-01-04",cost:57,fuelType:"",notes:""},
    {distance:350,date:"2026-01-26",cost:57,fuelType:"",notes:""},
    {distance:372,date:"2026-02-14",cost:57,fuelType:"",notes:""},
    {distance:348,date:"2026-02-15",cost:55,fuelType:"",notes:""},
    {distance:292,date:"2026-02-22",cost:47,fuelType:"",notes:""},
    {distance:267,date:"2026-03-16",cost:54,fuelType:"",notes:""},
    {distance:310,date:"2026-04-07",cost:48,fuelType:"",notes:""},
    {distance:313,date:"2026-05-04",cost:62,fuelType:"",notes:""},
    {distance:307,date:"2026-05-30",cost:59,fuelType:"",notes:""},
    {distance:311,date:"2026-06-22",cost:62,fuelType:"",notes:""},
    {distance:273,date:"2026-07-19",cost:54,fuelType:"",notes:""},
    {distance:279,date:"2026-08-12",cost:58,fuelType:"",notes:""},
    {distance:322,date:"2026-09-01",cost:58,fuelType:"",notes:""}
];

let entries = [];

function loadEntries() {
    const stored = localStorage.getItem("petrolEntries");
    if (stored) { entries = JSON.parse(stored); }
    else { entries = [...defaultEntries]; saveEntries(); }
}

function saveEntries() {
    localStorage.setItem("petrolEntries", JSON.stringify(entries));
}

function fmtDate(d) {
    const parts = d.split("-");
    return parts[2] + "/" + parts[1] + "/" + parts[0];
}

function fuelBadge(ft, notes) {
    if (ft === "97")   return '<span class="badge badge-97">R97</span>';
    if (ft === "half") return '<span class="badge badge-half">Half Tank</span>';
    if (ft === "95")   return '<span class="badge badge-95">95</span>';
    if (notes)         return '<span class="badge badge-95">' + notes + '</span>';
    return '<span style="color:#aaa">—</span>';
}

function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    const sorted = [...entries].sort((a,b) => new Date(a.date) - new Date(b.date));
    sorted.forEach((e, i) => {
        const originalIndex = entries.indexOf(e);
        const rPerKm = (e.cost / e.distance).toFixed(3);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${i+1}</td><td>${fmtDate(e.date)}</td><td>${e.distance}</td>` +
            `<td>RM${e.cost.toFixed(2)}</td><td>${fuelBadge(e.fuelType, e.notes)}</td>` +
            `<td>${e.notes||""}</td><td>${rPerKm}</td>` +
            `<td><button class="btn-delete" onclick="delEntry(${originalIndex})">✕</button></td>`;
        tbody.appendChild(tr);
    });
    document.getElementById("entryCount").textContent = entries.length;
}

function renderSummary() {
    const totalKm   = entries.reduce((s,e) => s + e.distance, 0);
    const totalCost = entries.reduce((s,e) => s + e.cost, 0);
    const avgTrip   = entries.length ? (totalCost / entries.length).toFixed(2) : "—";
    const avgRkm    = totalKm ? (totalCost / totalKm).toFixed(3) : "—";
    document.getElementById("summaryCards").innerHTML = `
        <div class="card"><div class="label">Total Distance</div><div class="value">${totalKm.toLocaleString()} km</div></div>
        <div class="card"><div class="label">Total Cost</div><div class="value">RM${totalCost.toFixed(2)}</div></div>
        <div class="card"><div class="label">Avg / Trip</div><div class="value">RM${avgTrip}</div></div>
        <div class="card"><div class="label">Avg RM/km</div><div class="value">${avgRkm}</div></div>`;
}

function delEntry(idx) {
    if (confirm("Delete this entry?")) {
        entries.splice(idx, 1);
        saveEntries(); renderTable(); renderSummary();
    }
}

document.getElementById("petrolForm").addEventListener("submit", function(ev) {
    ev.preventDefault();
    const entry = {
        distance: parseFloat(document.getElementById("distance").value),
        date:     document.getElementById("date").value,
        cost:     parseFloat(document.getElementById("cost").value),
        fuelType: document.getElementById("fuelType").value,
        notes:    document.getElementById("notes").value.trim()
    };
    entries.push(entry);
    saveEntries(); renderTable(); renderSummary();
    this.reset();
});

loadEntries(); renderTable(); renderSummary();
</script>
</body>
</html>
